name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=hananbahi527&show_icons=true&hide_border=true&rank_icon=percentile&title_color=FF2E88&icon_color=FFD43B&text_color=9FFFFF&bg_color=0D1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate most-used-languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=hananbahi527&layout=compact&hide_border=true&title_color=FF2E88&text_color=9FFFFF&bg_color=0D1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub stats cards"
          git push
